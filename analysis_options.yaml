include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Samples checkout fetched by the E2E suite; it is analyzed on its own.
    - tests/e2e/.samples/**
    # The playground app has its own pubspec and analysis_options; analyze it from playground/.
    - playground/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
